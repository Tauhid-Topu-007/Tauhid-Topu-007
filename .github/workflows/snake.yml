name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"  # প্রতি 6 ঘণ্টায়
  workflow_dispatch:  # ম্যানুয়ালি রান করার জন্য

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # important for pushing to output branch
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: tauhid-topu-007  # আপনার ইউজারনেম
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            
      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '🐍 Generate snake animation'
          
      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -la dist/