name: Metrics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tauhid-topu-007
          template: classic
          base: header, activity, community, repositories
          config_octicon: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14